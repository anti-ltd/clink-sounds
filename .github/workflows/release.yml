name: Release sounds

on:
  push:
    branches: [main]
    paths: ["Sounds/**", "tools/**", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release manifest
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 tools/build-manifest.py
      - name: Validate release manifest
        run: python3 tools/validate-manifest.py
      - name: Replace latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest Sounds/*.clinkpack manifest.json --title "Latest sounds" --notes "Automatically published from main." || gh release create latest manifest.json --title "Latest sounds" --notes "No sound packs have been published yet."
